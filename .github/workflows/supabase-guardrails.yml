name: Supabase Security Guardrails

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-guardrails.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: supabase/setup-cli@92db02b2f3a5460f5237ee0170be166c68b3a71d # v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations + seed)
        run: supabase start --exclude studio,imgproxy,inbucket

      - name: Run security guardrails
        run: |
          set -euo pipefail
          for f in supabase/guardrails/*.sql; do
            echo "── $f ──"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
