name: 🐞 Bug report
description: Something behaves differently than documented or expected.
title: "[Bug]: "
labels: ["bug"]
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search [existing issues](https://github.com/SriSatyaLokesh/card-crew/issues) first to avoid a duplicate.

        **Found a security vulnerability instead?** Do not file it here — see [SECURITY.md](https://github.com/SriSatyaLokesh/card-crew/blob/main/SECURITY.md) for private reporting.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What should have happened instead? Link to the relevant doc (e.g. docs/API_CONTRACT.md) if it documents the expected behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, including any request bodies/query params if this is an API bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      multiple: true
      options:
        - frontend/ (web app)
        - backend/ (Express API)
        - supabase/ (schema, RLS, RPC)
        - tests/integration/
        - Deployment / CI
        - Docs
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / branch
      description: Which commit SHA or branch were you on? (`git rev-parse HEAD`)
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser (if frontend), local vs. deployed.
      placeholder: |
        - OS:
        - Node version:
        - Browser (if applicable):
        - Local dev / Cloudflare deployment:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any error output. This is rendered as text — no need for backticks.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: This report does not include real card numbers, CVVs, PINs, OTPs, or bank credentials (Card Crew never stores these — if your report involves them, something has already gone wrong; report it privately per SECURITY.md instead).
          required: true
